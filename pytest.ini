[pytest]
#addopts = -v -s --alluredir=allure-results
addopts = -v -s
testpaths = Tests
python_files = test_*.py
log_cli = true
log_cli_level = INFO

markers =
    smoke: fast tests for critical functionality
    regression: full test suite
    api: All API tests
    ui: All UI tests

    positive: positive tests
    negative: negative tests

    fakestore: tests for FakeStore API
    restfulbooker: test for RestfulBooker API